html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:32px 20px 56px}
h1{font:500 30px/1.15 Newsreader,Georgia,serif;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.row{display:flex;align-items:center;gap:12px;margin-bottom:10px}.row span{width:64px;color:var(--mute);font-size:14px}
input{flex:1;width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input.ko{border-color:var(--ko)}
.btn{font:600 16px Figtree,sans-serif;background:var(--acc);color:var(--on);border:0;border-radius:8px;padding:12px 20px;cursor:pointer}
.ghost,.link{font:500 15px Figtree,sans-serif;background:none;border:0;color:var(--mute);cursor:pointer;padding:12px}
.link{margin-top:20px;padding-left:0}
.msg{color:var(--ko);font-size:14px;min-height:20px;margin:6px 0 12px}
.list{display:grid;gap:10px}
.lvl{display:grid;grid-template-columns:1fr auto;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;cursor:pointer;color:var(--ink);font:inherit}
.lvl .t{font:500 20px Newsreader,Georgia,serif}.lvl .d,.lvl .b{color:var(--mute);font-size:14px}.lvl .b{text-align:right;align-self:end}
.top{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:8px}
.bar{height:3px;background:var(--line);border-radius:2px;margin-bottom:20px}.bar i{display:block;height:100%;background:var(--acc);border-radius:2px}
.lab{color:var(--mute);margin:0 0 6px}
.big{font:500 26px/1.3 Newsreader,Georgia,serif;margin:0 0 18px}.big.num{font-size:44px;letter-spacing:.02em}
.fb{margin:14px 0 0;padding:12px 14px;border-left:3px solid var(--line);background:var(--bg);border-radius:0 8px 8px 0}
.fb.ok{border-color:var(--ok)}.fb.ko{border-color:var(--ko)}.fb b{display:block}
.acts{display:flex;gap:8px;align-items:center;margin-top:16px}
.score{font:500 52px/1 Newsreader,Georgia,serif;margin:4px 0 16px}
.err{margin:0 0 6px;font-size:15px}.err b{font-weight:600}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
.lvl[disabled]{opacity:.55;cursor:default}
.sm{font-size:14px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{font:500 14px Figtree,sans-serif;background:none;color:var(--mute);border:1px solid var(--line);border-radius:16px;padding:5px 12px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.days{display:flex;gap:4px;align-items:flex-end;height:70px;margin:8px 0 18px}
.day{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;color:var(--mute);font-size:11px}
.day i{display:block;width:100%;background:var(--acc);border-radius:2px 2px 0 0;opacity:.8}
.day.none i{height:2px!important;background:var(--line)}
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line)}
.srow .sn{font:500 17px Newsreader,Georgia,serif}.srow .sp{font-weight:600}.srow small{grid-column:2/4;color:var(--mute)}
.kpi{display:flex;gap:24px;margin:0 0 6px}.kpi b{display:block;font:500 28px Newsreader,Georgia,serif}.kpi span{color:var(--mute);font-size:14px}
.nav{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-12px 0 24px}
.nav button{font:500 15px Figtree,sans-serif;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:10px 12px;cursor:pointer}
.nav button.on{color:var(--ink);border-color:var(--acc)}
.card.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.card.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 14%,var(--card))}
.fb .v{font:600 20px Figtree,sans-serif;margin-bottom:4px}.fb.ok .v{color:var(--ok)}.fb.ko .v{color:var(--ko)}
.tm{height:4px;background:var(--line);border-radius:2px;margin:0 0 18px}.tm i{display:block;height:100%;width:100%;background:var(--acc);border-radius:2px}
.tip{min-height:22px;color:var(--mute);font-size:14px;margin:0 0 14px}
.srow small.ac{color:var(--acc)}
.add{display:grid;gap:8px;margin-bottom:18px}
.day{cursor:pointer}.days{height:90px;gap:2px}.day small{font-size:9px}

const L=[{k:2,n:"Échauffement",d:"Comptes à 2 chiffres"},{k:3,n:"Initié",d:"Comptes à 3 chiffres"},{k:4,n:"Intermédiaire",d:"Comptes à 4 chiffres"},{k:5,n:"Expert",d:"Comptes à 5 chiffres"}];
const REV={n:"Révision",d:"Tes 150 comptes les moins bien réussis"};
const C=[["capitaux"],["immobilisation"],["stock"],["tiers"],["financier","tresorerie"],["charge"],["produit"]];
const CN=["Comptes de capitaux","Comptes d’immobilisations","Comptes de stocks et en-cours","Comptes de tiers","Comptes financiers (ou de trésorerie)","Comptes de charges","Comptes de produits"];
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
function dice(a,b){a=norm(a);b=norm(b);if(a===b)return 1;if(a.length<2||b.length<2)return 0;const g=s=>{const m={};for(let i=0;i<s.length-1;i++){const x=s.slice(i,i+2);m[x]=(m[x]||0)+1}return m};const x=g(a),y=g(b);let c=0;for(const k in x)if(y[k])c+=Math.min(x[k],y[k]);return 2*c/(a.length+b.length-2)}
const A={},ALL=[];
for(const k in D){A[k]=D[k].split("\n").map(l=>{const p=l.split("|");return{n:p[0],t:p[1],h:p[2]||"",k:+k}});ALL.push(...A[k])}
const sig=a=>norm(a.t)+"#"+norm(a.h);
ALL.forEach(a=>a.same=ALL.filter(b=>b.k===a.k&&sig(b)===sig(a)));
const label=a=>a.t+(a.h?` (${a.h})`:"");
const dstr=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const pct=(o,t)=>t?Math.round(100*o/t):null;
const rt=a=>{const r=S.a[a.n];return (r[0]+r[2])/(r[1]+r[3])};
const nb=a=>S.a[a.n][1]+S.a[a.n][3];

/* Mémoire des statistiques : stockage privé du viewer, avec copie locale */
let S={a:{},d:{},ac:[]},dbDoc=null,timer=null,saving=false;
const fix=j=>({a:j.a||{},d:j.d||{},ac:j.ac||[]});
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
async function initStore(){
  try{const u=await claude.use("user"),db=await claude.use("db");
    if(u&&db){const id=await u.id();if(id){dbDoc=db.collection("data/users/"+id).doc("stats");const s=await dbDoc.get();
      if(s.exists){const d=s.data();if(d&&d.a){S=fix(d);return}}}}}catch(e){}
  try{const j=JSON.parse(ls.get("pcgS")||"null");if(j&&j.a)S=fix(j)}catch(e){}
}
async function flush(){if(!dbDoc)return;if(saving){timer=setTimeout(flush,800);return}saving=true;try{await dbDoc.set({a:S.a,d:S.d,ac:S.ac})}catch(e){}saving=false}
function save(){ls.set("pcgS",JSON.stringify(S));clearTimeout(timer);timer=setTimeout(flush,800)}
document.addEventListener("visibilitychange",()=>{if(document.hidden){clearTimeout(timer);flush()}});
function record(a,mode,good){
  const r=S.a[a.n]||(S.a[a.n]=[0,0,0,0]),i=mode==="nom"?0:2;r[i+1]++;if(good)r[i]++;
  const k=dstr(new Date());let d=S.d[k];if(!d||Array.isArray(d))d=S.d[k]={};
  const e=d[a.k]||(d[a.k]=[0,0]);e[1]++;if(good)e[0]++;save();
}
const dayVal=(v,k)=>{if(!v)return[0,0];if(Array.isArray(v))return k==="all"?v:[0,0];if(k!=="all")return v[k]||[0,0];let o=0,t=0;for(const x in v){o+=v[x][0];t+=v[x][1]}return[o,t]};
const ready=initStore();
function expand(v,a){const nt=norm(a.t);let x=" "+norm(v)+" ";S.ac.forEach(c=>{if(c.s&&c.d&&nt.includes(norm(c.d)))x=x.split(" "+norm(c.s)+" ").join(" "+norm(c.d)+" ")});return x.trim()}
const sigles=a=>S.ac.filter(c=>c.d&&norm(a.t).includes(norm(c.d))).map(c=>c.s);

const app=document.getElementById("app");let tries=0,g=null,fs={k:"all",dir:"desc",n:60},rv={k:"all",n:80};
const TIME=40,MEM=40;
const nav=on=>`<nav class="nav">${[["menu","Jouer"],["revs","Révisions"],["acr","Acronymes"],["stats","Stats"]].map(([k,n])=>`<button class="${on===k?"on":""}" data-go="${k}">${n}</button>`).join("")}</nav>`;
const wire=()=>app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>({menu,revs,acr,stats})[b.dataset.go]());
const chips=(cur,fn)=>{const c=(k,n)=>`<button class="chip ${cur===k?"on":""}" data-k="${k}">${n}</button>`;return `<div class="chips">${c("all","Tous")}${L.map(l=>c(l.k,l.n)).join("")}</div>`};
const wireChips=(set,fn)=>app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{set(b.dataset.k==="all"?"all":+b.dataset.k);fn()});

function classes(){
  const i=Math.floor(Math.random()*7);tries=0;
  app.innerHTML=`<h1>Avant de jouer</h1><p class="sub">Quel est l’intitulé de la classe ${i+1} du plan comptable ?</p><div class="card"><input id="c" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Classe ${i+1}"><p class="msg" id="msg"></p><button class="btn" id="go">Vérifier</button></div>`;
  const el=document.getElementById("c");
  const check=()=>{const v=norm(el.value);if(C[i].some(w=>v.includes(w)))return menu();
    tries++;el.classList.add("ko");let m="Ce n’est pas ça, réessaie.";if(tries>=3)m+=` Indice : ${CN[i].toLowerCase()}.`;document.getElementById("msg").textContent=m};
  document.getElementById("go").onclick=check;
  el.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();check()}});el.focus();
}
function lv(k){let o=0,t=0;A[k].forEach(a=>{const r=S.a[a.n];if(r){o+=r[0]+r[2];t+=r[1]+r[3]}});return pct(o,t)}
const revPool=()=>ALL.filter(a=>S.a[a.n]&&rt(a)<=.9).sort((a,b)=>rt(a)-rt(b)||nb(b)-nb(a)).slice(0,100);
function menu(){
  const played=Object.keys(S.a).length,off=played<20||revPool().length<10;
  app.innerHTML=nav("menu")+`<h1>Plan comptable</h1><p class="sub">Choisis un niveau. Les questions s’enchaînent sans fin, ${TIME} secondes par question.</p><div class="list">${L.map(l=>{const r=lv(l.k);return `<button class="lvl" data-k="${l.k}"><span class="t">${l.n}</span><span class="b">${r===null?"":"Réussite "+r+" %"}</span><span class="d">${l.d}</span></button>`}).join("")}<button class="lvl" data-k="0" ${off?"disabled":""}><span class="t">${REV.n}</span><span class="b"></span><span class="d">${off?"Disponible après 20 comptes joués":REV.d}</span></button></div>`;
  app.querySelectorAll(".lvl").forEach(b=>b.onclick=()=>start(+b.dataset.k));wire();
}
async function start(k){
  await ready;
  g={k,l:k?L.find(l=>l.k===k):REV,pool:k?A[k]:revPool(),recent:[],score:0,total:0,wrong:[]};play();
}
function pick(){
  const ex=new Set(g.recent);let c=g.pool.filter(a=>!ex.has(a.n));if(!c.length)c=g.pool;
  const a=c[Math.floor(Math.random()*c.length)];g.recent.push(a.n);
  if(g.recent.length>Math.min(MEM,g.pool.length-1))g.recent.shift();return a;
}
function play(){
  const a=pick(),mode=Math.random()<.5?"nom":"num",nom=mode==="nom";g.done=false;clearInterval(g.iv);
  app.innerHTML=`<div class="top"><span>${g.l.n}</span><span>${g.score} / ${g.total}</span><button class="ghost sm" id="stop">Terminer</button></div><div class="tm"><i id="tm"></i></div><div class="card" id="card"><p class="lab">${nom?"Quel est l’intitulé de ce compte ?":"Quel est le numéro de ce compte ?"}</p><p class="big ${nom?"num":""}">${nom?a.n:label(a)}</p><input id="ans" ${nom?"":'inputmode="numeric"'} autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${nom?"Intitulé":"Numéro"}"><div id="fb"></div><div class="acts"><button class="btn" id="ok">Valider</button><button class="ghost" id="skip">Passer</button><span class="lab" id="tt" style="margin-left:auto"></span></div></div>`;
  const ans=document.getElementById("ans"),ok=document.getElementById("ok"),skip=document.getElementById("skip"),card=document.getElementById("card");
  const submit=(sk,to)=>{clearInterval(g.iv);const v=ans.value.trim();
    const good=!sk&&(nom?Math.max(dice(v,a.t),dice(expand(v,a),a.t))>=.72:a.same.some(b=>b.n===v.replace(/\s/g,"")));
    g.total++;if(good)g.score++;else g.wrong.push(a);record(a,mode,good);
    const alt=!nom&&a.same.length>1?`<br>Numéros acceptés : ${a.same.map(b=>b.n).join(", ")}`:"";
    card.classList.add(good?"ok":"ko");
    document.getElementById("fb").innerHTML=`<div class="fb ${good?"ok":"ko"}"><div class="v">${good?"✓ Correct":to?"✗ Temps écoulé":"✗ Incorrect"}</div>${a.n} ${label(a)}${alt}</div>`;
    ans.disabled=true;skip.style.display="none";g.done=true;ok.textContent="Suivant";ok.focus()};
  ok.onclick=()=>g.done?play():submit(false);
  skip.onclick=()=>submit(true);
  document.getElementById("stop").onclick=end;
  ans.addEventListener("keydown",e=>{if(e.key==="Enter"&&!g.done){e.preventDefault();submit(false)}});
  const t0=Date.now(),tm=document.getElementById("tm"),tt=document.getElementById("tt");
  g.iv=setInterval(()=>{const l=Math.max(0,TIME-(Date.now()-t0)/1000);tm.style.width=l/TIME*100+"%";tt.textContent=Math.ceil(l)+" s";if(l<=0)submit(true,true)},200);
  ans.focus();
}
function end(){
  clearInterval(g.iv);if(!g.total)return menu();
  const w=[...new Set(g.wrong)];
  app.innerHTML=`<h1>${g.l.n}</h1><p class="sub">Séance terminée</p><div class="card"><p class="score">${g.score} / ${g.total}</p>${w.length?`<p class="lab">À retravailler</p>${w.map(a=>`<p class="err"><b>${a.n}</b> ${label(a)}</p>`).join("")}`:`<p>Aucune erreur sur cette séance.</p>`}<div class="acts"><button class="btn" id="again">Reprendre</button><button class="ghost" id="back">Menu</button></div></div>`;
  document.getElementById("again").onclick=()=>start(g.k);
  document.getElementById("back").onclick=menu;
}
function stats(){
  const sel=ALL.filter(a=>fs.k==="all"||a.k===fs.k),seen=sel.filter(a=>S.a[a.n]);
  let ok=0,tot=0;seen.forEach(a=>{const r=S.a[a.n];ok+=r[0]+r[2];tot+=r[1]+r[3]});
  const rows=seen.slice().sort((a,b)=>(fs.dir==="desc"?rt(b)-rt(a):rt(a)-rt(b))||(a.n<b.n?-1:1));
  const days=[];for(let i=29;i>=0;i--){const d=new Date(Date.now()-i*864e5);days.push({d,v:dayVal(S.d[dstr(d)],fs.k)})}
  const mx=Math.max(1,...days.map(x=>x.v[1]));
  app.innerHTML=nav("stats")+`<h1>Statistiques</h1><p class="sub">Ta progression, enregistrée d’une séance à l’autre.</p>${chips(fs.k)}<div class="card"><div class="kpi"><div><b>${tot?pct(ok,tot)+" %":"–"}</b><span>de réussite</span></div><div><b>${tot}</b><span>réponses</span></div><div><b>${ok} / ${tot-ok}</b><span>Win / Lose</span></div></div><p class="lab">${seen.length} comptes vus sur ${sel.length}</p><p class="lab">Réponses par jour, 30 derniers jours</p><div class="days">${days.map((x,i)=>{const p=x.v[1]?pct(x.v[0],x.v[1]):0;return `<div class="day" data-i="${i}"><i style="height:${x.v[1]/mx*100}%;${x.v[1]?`min-height:2px;background:linear-gradient(to top,var(--ok) ${p}%,var(--ko) ${p}%)`:""}"></i><small>${x.d.getDate()}</small></div>`}).join("")}</div><p class="tip" id="tip">Touche une barre pour voir le détail du jour.</p>
  <button class="ghost sm" id="dir">${fs.dir==="desc"?"Plus connus d’abord":"Moins connus d’abord"}</button>
  ${rows.length?rows.slice(0,fs.n).map(a=>{const r=S.a[a.n],f=(o,t)=>t?pct(o,t)+" % ("+t+")":"–";return `<div class="srow"><span class="sn">${a.n}</span><span>${label(a)}</span><span class="sp">${pct(r[0]+r[2],r[1]+r[3])} %</span><small>Intitulé ${f(r[0],r[1])} · Numéro ${f(r[2],r[3])}</small></div>`}).join(""):`<p class="sub">Aucun compte joué pour l’instant.</p>`}
  ${rows.length>fs.n?`<button class="link" id="more">Afficher la suite</button>`:""}</div>`;
  wire();wireChips(k=>{fs.k=k;fs.n=60},stats);
  const tip=document.getElementById("tip");
  app.querySelectorAll(".day").forEach(el=>{const show=()=>{const x=days[+el.dataset.i],[o,t]=x.v;tip.textContent=x.d.toLocaleDateString("fr-FR",{day:"numeric",month:"long"})+" : "+(t?`${t} réponses, ${pct(o,t)} % de réussite (${o} gagnées, ${t-o} perdues)`:"aucune réponse")};el.onclick=show;el.onmouseenter=show});
  document.getElementById("dir").onclick=()=>{fs.dir=fs.dir==="desc"?"asc":"desc";stats()};
  const m=document.getElementById("more");if(m)m.onclick=()=>{fs.n+=60;stats()};
}
function revs(){
  app.innerHTML=nav("revs")+`<h1>Révisions</h1><p class="sub">Les ${ALL.length} comptes du PCG 2026.</p><input id="q" placeholder="Rechercher un numéro, un intitulé ou un sigle" style="margin-bottom:12px">${chips(rv.k)}<div id="rl"></div>`;
  wire();wireChips(k=>{rv.k=k;rv.n=80},revs);
  const q=document.getElementById("q"),rl=document.getElementById("rl");
  const draw=()=>{const s=norm(q.value);const rows=ALL.filter(a=>(rv.k==="all"||a.k===rv.k)&&(!s||norm(a.n+" "+label(a)+" "+sigles(a).join(" ")).includes(s)));
    rl.innerHTML=rows.slice(0,rv.n).map(a=>{const r=S.a[a.n],sg=sigles(a);return `<div class="srow"><span class="sn">${a.n}</span><span>${label(a)}</span><span class="sp">${r?pct(r[0]+r[2],r[1]+r[3])+" %":""}</span>${r||sg.length?`<small>${r?`Intitulé ${pct(r[0],r[1])??"–"} % · Numéro ${pct(r[2],r[3])??"–"} %`:""}${sg.length?` <span class="ac">Sigle : ${sg.join(", ")}</span>`:""}</small>`:""}</div>`}).join("")+(rows.length>rv.n?`<button class="link" id="more">Afficher la suite</button>`:"");
    const m=document.getElementById("more");if(m)m.onclick=()=>{rv.n+=80;draw()}};
  q.oninput=()=>{rv.n=80;draw()};draw();
}
function acr(msg=""){
  app.innerHTML=nav("acr")+`<h1>Acronymes</h1><p class="sub">Un sigle est accepté comme réponse quand sa définition fait partie de l’intitulé du compte.</p><div class="card add"><input id="s" placeholder="Sigle (ex. VMP)" autocomplete="off"><input id="d" placeholder="Définition (ex. Valeurs mobilières de placement)" autocomplete="off"><button class="btn" id="add">Ajouter</button><p class="msg">${msg}</p></div>${S.ac.map((c,i)=>`<div class="srow"><span class="sn">${c.s}</span><span>${c.d}</span><button class="ghost sm" data-i="${i}">Supprimer</button></div>`).join("")||`<p class="sub">Aucun acronyme pour l’instant.</p>`}`;
  wire();
  document.getElementById("add").onclick=()=>{const s=document.getElementById("s").value.trim(),d=document.getElementById("d").value.trim();
    if(!s||!d)return acr("Remplis le sigle et sa définition.");
    S.ac.push({s,d});save();acr(ALL.some(a=>norm(a.t).includes(norm(d)))?"":"Enregistré, mais aucun intitulé ne contient cette définition.")};
  app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{S.ac.splice(+b.dataset.i,1);save();acr()});
}
classes();
</script></body></html>
